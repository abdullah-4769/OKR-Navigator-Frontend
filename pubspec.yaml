name: game_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.8.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_screenutil: ^5.9.3
  stacked_card_carousel: ^0.0.4
  bloc: ^9.0.1
  connectivity_plus: ^7.0.0
  shared_preferences: ^2.5.3
  flutter_bloc: ^9.1.1
  firebase_core: ^4.2.1
  #  cloud_firestore: ^6.0.2
  dio: ^5.9.0
  path_provider: ^2.1.5
  google_fonts: ^6.3.2
  intl: ^0.20.2
  get: ^4.7.2
  http: ^1.5.0
  flutter_dotenv: ^6.0.0
  firebase_messaging: ^16.0.2
  flutter_local_notifications: ^17.1.2 # Example of a known stable
  get_storage: ^2.1.1
  flutter_svg: ^2.2.1
  carousel_slider: ^5.1.1
  share_plus: ^10.1.2
  google_sign_in: ^6.2.1
  firebase_auth:
  font_awesome_flutter: ^10.9.1
  flutter_secure_storage: ^9.2.4
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  retrofit: ^4.7.3


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  retrofit_generator: ^10.0.6
  build_runner: ^2.8.0

flutter:
  generate: true

  uses-material-design: true

  assets:
    - assets/images/
    - assets/carte defis/
    - assets/cartes objectifs/

  fonts:
    - family: Gotham
      fonts:
        - asset: assets/fonts/gotham_book.ttf
    - family: GothamMedium
      fonts:
        - asset: assets/fonts/gotham_medium.ttf
    - family: GothamBold
      fonts:
        - asset: assets/fonts/gotham_bold.ttf
    - family: GothamExtraBold
      fonts:
        - asset: assets/fonts/gotham_black_900.ttf
    - family: GothamUltra
      fonts:
        - asset: assets/fonts/gotham_ultra.ttf